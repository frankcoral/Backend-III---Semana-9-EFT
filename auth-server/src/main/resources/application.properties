spring.application.name=auth-server
server.port=${AUTH_SERVER_PORT:9000}

# EFT - OAuth2 Authorization Server
# Usuario de demostracion para el flujo authorization_code.
spring.security.user.name=${OAUTH2_DEMO_USER:banco_user}
spring.security.user.password=${OAUTH2_DEMO_PASSWORD:banco123}

# Issuer del servidor OAuth2.
# En Docker Compose se conserva un issuer estable visible por el cliente; la JWK se resuelve internamente.
spring.security.oauth2.authorizationserver.issuer=${AUTH_ISSUER_URI:http://localhost:9000}

# Cliente 1: pruebas automatizadas / comunicacion servicio-a-servicio.
spring.security.oauth2.authorizationserver.client.banco-service.registration.client-id=${OAUTH2_SERVICE_CLIENT_ID:banco-service}
spring.security.oauth2.authorizationserver.client.banco-service.registration.client-secret={noop}${OAUTH2_SERVICE_CLIENT_SECRET:banco-service-secret}
spring.security.oauth2.authorizationserver.client.banco-service.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.banco-service.registration.authorization-grant-types[0]=client_credentials
spring.security.oauth2.authorizationserver.client.banco-service.registration.scopes[0]=banco.read
spring.security.oauth2.authorizationserver.client.banco-service.registration.scopes[1]=banco.write
spring.security.oauth2.authorizationserver.client.banco-service.token.access-token-time-to-live=15m

# Cliente 2: flujo interactivo OAuth2 con usuario.
spring.security.oauth2.authorizationserver.client.banco-web.registration.client-id=${OAUTH2_WEB_CLIENT_ID:banco-web}
spring.security.oauth2.authorizationserver.client.banco-web.registration.client-secret={noop}${OAUTH2_WEB_CLIENT_SECRET:banco-web-secret}
spring.security.oauth2.authorizationserver.client.banco-web.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.banco-web.registration.authorization-grant-types[0]=authorization_code
spring.security.oauth2.authorizationserver.client.banco-web.registration.authorization-grant-types[1]=refresh_token
spring.security.oauth2.authorizationserver.client.banco-web.registration.redirect-uris[0]=${OAUTH2_WEB_REDIRECT_URI:https://localhost:8081/login/oauth2/code/banco-web}
spring.security.oauth2.authorizationserver.client.banco-web.registration.scopes[0]=openid
spring.security.oauth2.authorizationserver.client.banco-web.registration.scopes[1]=profile
spring.security.oauth2.authorizationserver.client.banco-web.registration.scopes[2]=banco.read
spring.security.oauth2.authorizationserver.client.banco-web.registration.scopes[3]=banco.write
spring.security.oauth2.authorizationserver.client.banco-web.registration.scopes[4]=canal.web
spring.security.oauth2.authorizationserver.client.banco-web.require-authorization-consent=true
spring.security.oauth2.authorizationserver.client.banco-web.token.authorization-code-time-to-live=5m
spring.security.oauth2.authorizationserver.client.banco-web.token.access-token-time-to-live=15m
spring.security.oauth2.authorizationserver.client.banco-web.token.refresh-token-time-to-live=60m
spring.security.oauth2.authorizationserver.client.banco-web.token.reuse-refresh-tokens=false

# Cliente 3: canal Mobile
spring.security.oauth2.authorizationserver.client.banco-mobile.registration.client-id=${OAUTH2_MOBILE_CLIENT_ID:banco-mobile}
spring.security.oauth2.authorizationserver.client.banco-mobile.registration.client-secret={noop}${OAUTH2_MOBILE_CLIENT_SECRET:banco-mobile-secret}
spring.security.oauth2.authorizationserver.client.banco-mobile.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.banco-mobile.registration.authorization-grant-types[0]=client_credentials
spring.security.oauth2.authorizationserver.client.banco-mobile.registration.scopes[0]=banco.read
spring.security.oauth2.authorizationserver.client.banco-mobile.registration.scopes[1]=canal.mobile
spring.security.oauth2.authorizationserver.client.banco-mobile.token.access-token-time-to-live=15m

# Cliente 4: canal ATM
spring.security.oauth2.authorizationserver.client.banco-atm.registration.client-id=${OAUTH2_ATM_CLIENT_ID:banco-atm}
spring.security.oauth2.authorizationserver.client.banco-atm.registration.client-secret={noop}${OAUTH2_ATM_CLIENT_SECRET:banco-atm-secret}
spring.security.oauth2.authorizationserver.client.banco-atm.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.banco-atm.registration.authorization-grant-types[0]=client_credentials
spring.security.oauth2.authorizationserver.client.banco-atm.registration.scopes[0]=banco.read
spring.security.oauth2.authorizationserver.client.banco-atm.registration.scopes[1]=banco.write
spring.security.oauth2.authorizationserver.client.banco-atm.registration.scopes[2]=canal.atm
spring.security.oauth2.authorizationserver.client.banco-atm.token.access-token-time-to-live=15m

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
