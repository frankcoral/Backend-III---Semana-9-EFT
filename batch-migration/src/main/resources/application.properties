spring.application.name=batch-migration

spring.datasource.url=${BATCH_DB_URL:jdbc:mysql://localhost:3307/banco_batch?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${BATCH_DB_USER:root}
spring.datasource.password=${BATCH_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=true
spring.batch.job.name=${BATCH_JOB_NAME:reporteTransaccionesDiariasJob}
spring.sql.init.mode=always

batch.chunk-size=${BATCH_CHUNK_SIZE:25}
batch.partition.grid-size=${BATCH_GRID_SIZE:4}
batch.partition.threads=${BATCH_THREADS:4}

batch.retry.max-retries=${BATCH_RETRY_MAX:3}
batch.retry.delay-ms=${BATCH_RETRY_DELAY_MS:200}
batch.retry.multiplier=${BATCH_RETRY_MULTIPLIER:2.0}
batch.retry.max-delay-ms=${BATCH_RETRY_MAX_DELAY_MS:1000}

batch.skip.max-errors=${BATCH_SKIP_MAX_ERRORS:1000}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always