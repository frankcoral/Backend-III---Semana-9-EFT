services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: eft-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - banco-net

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      - kafka
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Esperando a Kafka..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic banco.cuentas.eventos --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic banco.transacciones.completadas --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic banco.clientes.eventos --partitions 3 --replication-factor 1
        echo "Topics Kafka EFT listos."
    networks:
      - banco-net

  mysql:
    image: mysql:8.4
    container_name: eft-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - eft-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - banco-net

  config-server:
    build:
      context: ./config-server
    image: banco-config-server:eft
    container_name: banco-config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: on-failure
    networks:
      - banco-net

  discovery-server:
    build:
      context: ./discovery-server
    image: banco-discovery-server:eft
    container_name: banco-discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: on-failure
    networks:
      - banco-net

  auth-server:
    build:
      context: ./auth-server
    image: banco-auth-server:eft
    container_name: banco-auth-server
    ports:
      - "9000:9000"
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://localhost:9000}
      OAUTH2_WEB_REDIRECT_URI: ${OAUTH2_WEB_REDIRECT_URI:-https://localhost:8081/login/oauth2/code/banco-web}
      OAUTH2_DEMO_USER: ${OAUTH2_DEMO_USER:-banco_user}
      OAUTH2_DEMO_PASSWORD: ${OAUTH2_DEMO_PASSWORD:-banco123}
      OAUTH2_SERVICE_CLIENT_SECRET: ${OAUTH2_SERVICE_CLIENT_SECRET:-banco-service-secret}
      OAUTH2_WEB_CLIENT_SECRET: ${OAUTH2_WEB_CLIENT_SECRET:-banco-web-secret}
      OAUTH2_MOBILE_CLIENT_SECRET: ${OAUTH2_MOBILE_CLIENT_SECRET:-banco-mobile-secret}
      OAUTH2_ATM_CLIENT_SECRET: ${OAUTH2_ATM_CLIENT_SECRET:-banco-atm-secret}
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/oauth2/jwks | grep -q '\"keys\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: on-failure
    networks:
      - banco-net

  cuentas-service:
    build:
      context: ./cuentas-service
    image: banco-cuentas-service:eft
    expose:
      - "8084"
    environment:
      CUENTAS_SERVICE_PORT: 8084
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://localhost:9000}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${JWK_SET_URI:-http://auth-server:9000/oauth2/jwks}
      CUENTAS_DB_URL: ${CUENTAS_DB_URL:-jdbc:mysql://mysql:3306/banco_cuentas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      CUENTAS_DB_USER: root
      CUENTAS_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: on-failure
    networks:
      - banco-net

  pagos-service:
    build:
      context: ./pagos-service
    image: banco-pagos-service:eft
    expose:
      - "8085"
    environment:
      PAGOS_SERVICE_PORT: 8085
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://localhost:9000}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${JWK_SET_URI:-http://auth-server:9000/oauth2/jwks}
      PAGOS_DB_URL: ${PAGOS_DB_URL:-jdbc:mysql://mysql:3306/banco_pagos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      PAGOS_DB_USER: root
      PAGOS_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      CUENTAS_SERVICE_URL: ${CUENTAS_SERVICE_URL:-http://cuentas-service}
    depends_on:
      mysql:
        condition: service_healthy
      cuentas-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: on-failure
    networks:
      - banco-net

  clientes-service:
    build:
      context: ./clientes-service
    image: banco-clientes-service:eft
    expose:
      - "8086"
    environment:
      CLIENTES_SERVICE_PORT: 8086
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://localhost:9000}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${JWK_SET_URI:-http://auth-server:9000/oauth2/jwks}
      CLIENTES_DB_URL: ${CLIENTES_DB_URL:-jdbc:mysql://mysql:3306/banco_clientes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      CLIENTES_DB_USER: root
      CLIENTES_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: on-failure
    networks:
      - banco-net

  bff-web:
    build:
      context: ./bff-web
    image: banco-bff-web:eft
    container_name: banco-bff-web
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://localhost:9000}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${JWK_SET_URI:-http://auth-server:9000/oauth2/jwks}
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:-changeit}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      cuentas-service:
        condition: service_healthy
      pagos-service:
        condition: service_healthy
      clientes-service:
        condition: service_healthy
    restart: on-failure
    networks:
      - banco-net

  bff-mobile:
    build:
      context: ./bff-mobile
    image: banco-bff-mobile:eft
    container_name: banco-bff-mobile
    ports:
      - "8082:8082"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://localhost:9000}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${JWK_SET_URI:-http://auth-server:9000/oauth2/jwks}
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:-changeit}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      cuentas-service:
        condition: service_healthy
      pagos-service:
        condition: service_healthy
      clientes-service:
        condition: service_healthy
    restart: on-failure
    networks:
      - banco-net

  bff-atm:
    build:
      context: ./bff-atm
    image: banco-bff-atm:eft
    container_name: banco-bff-atm
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://localhost:9000}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${JWK_SET_URI:-http://auth-server:9000/oauth2/jwks}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      KAFKA_TRANSACCIONES_CONCURRENCY: 3
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:-changeit}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      cuentas-service:
        condition: service_healthy
      pagos-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - banco-net

networks:
  banco-net:
    driver: bridge

volumes:
  eft-mysql-data:
